[project]
name = "cob-ghist"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "synapseclient",
    "python-dotenv",
    "tqdm",
    "matplotlib",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "pysrc"}
py-modules = ["plot_results", "synapse_retrieval"]

[tool.setuptools.packages.find]
where = ["pysrc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
