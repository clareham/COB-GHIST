[project]
name = "cob-ghist"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "synapseclient",
    "transformers>=4.57.1",
    "python-dotenv",
    "tqdm",
    "matplotlib",
    "pandas",
    "numpy",
    "biocommons.seqrepo",
    "msprime>=1.3",
    "biopython",
]

[project.scripts]
sweep-experiment = "sweep_experiments.__main__:main"

[tool.setuptools]
package-dir = {"" = "pysrc"}
py-modules = ["plot_results", "synapse_retrieval"]

[tool.setuptools.packages.find]
where = ["pysrc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
