[project]
name = "cob-ghist"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "synapseclient",
    "transformers",
    "python-dotenv",
    "tqdm",
    "matplotlib",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
experiments = ["biocommons.seqrepo", "msprime>=1.3", "biopython"]
cpu = ["torch==2.7.1"]
cuda = ["torch==2.7.1"]
rocm = [
    "torch==2.7.1",
    "pytorch-triton-rocm==3.3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[project.scripts]
sweep-experiment = "sweep_experiments.__main__:main"

[tool.setuptools]
package-dir = {"" = "pysrc"}
py-modules = ["plot_results", "synapse_retrieval"]

[tool.setuptools.packages.find]
where = ["pysrc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
